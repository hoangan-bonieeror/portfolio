<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>An Nguyen — Backend Developer</title>
    <meta
      name="description"
      content="An Nguyen is a Backend Developer who builds Python APIs, PostgreSQL data models and data pipelines — plus the systems that connect software to real hardware. Open to Backend and Software Developer roles."
    />
    <meta name="author" content="An Nguyen" />
    <meta name="theme-color" content="#F4ECE1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0F1A" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="An Nguyen — Backend Developer" />
    <meta
      property="og:description"
      content="APIs, data models and pipelines — with a background in robotics and industrial automation."
    />
    <meta property="og:url" content="https://hoangan-bonieeror.github.io/portfolio/" />
    <meta property="og:site_name" content="An Nguyen" />
    <!-- Preview image: regenerate with `npm run og` after editing src/content. -->
    <meta property="og:image" content="https://hoangan-bonieeror.github.io/portfolio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An Nguyen — Backend Developer. A 3D illustration of a dashboard, API server, PostgreSQL database and robot." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="An Nguyen — Backend Developer" />
    <meta name="twitter:description" content="APIs, data models and pipelines — with a background in robotics and industrial automation." />
    <meta name="twitter:image" content="https://hoangan-bonieeror.github.io/portfolio/og.png" />

    <link rel="canonical" href="https://hoangan-bonieeror.github.io/portfolio/" />

    <!-- Helps search engines understand who this site is about. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "An Nguyen",
        "jobTitle": "Backend Developer",
        "url": "https://hoangan-bonieeror.github.io/portfolio/",
        "image": "https://hoangan-bonieeror.github.io/portfolio/og.png",
        "address": { "@type": "PostalAddress", "addressLocality": "Pittsburg", "addressRegion": "CA", "addressCountry": "US" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Sai Gon University" },
        "knowsAbout": ["Python", "Flask", "REST APIs", "PostgreSQL", "Data engineering", "ETL", "ROS2"],
        "sameAs": [
          "https://github.com/hoangan-bonieeror",
          "https://www.linkedin.com/in/tran-hoang-an-nguyen-3168751a6/"
        ]
      }
    </script>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Apply the saved / system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
