<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Not Found · An Nguyen</title>
    <link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#f6f4ef; --surface:#fff; --ink:#1b1d29; --muted:#5e6173; --line:#e3dfd6; --accent:#5146e5; --rose:#d93d52; --code:#1b1d29; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0d0f1a; --surface:#151827; --ink:#eceef6; --muted:#9ca1b8; --line:#272c44; --accent:#8b84ff; --rose:#ff7a8a; --code:#0a0c15; }
      }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
      .card { width: min(100%, 480px); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 32px; box-shadow: 0 24px 48px -16px rgb(0 0 0 / .2); }
      .req { display: inline-flex; gap: 8px; align-items: center; font: 500 13px "JetBrains Mono", monospace; color: var(--muted); }
      .get { background: #dcf5ee; color: #0f9a7a; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 11px; }
      h1 { font: 800 72px/1 "Bricolage Grotesque", sans-serif; margin: 20px 0 8px; color: var(--rose); }
      h2 { font: 800 26px/1.2 "Bricolage Grotesque", sans-serif; }
      p { color: var(--muted); line-height: 1.6; margin-top: 10px; }
      pre { margin-top: 20px; background: var(--code); color: #e6e8f2; border-radius: 12px; padding: 14px; font: 12.5px/1.6 "JetBrains Mono", monospace; overflow: auto; }
      .k { color: #9ecbff; } .s { color: #a5e8c8; }
      a.btn { display: inline-block; margin-top: 24px; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 12px; font-weight: 500; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="req"><span class="get">GET</span><span id="path">/unknown</span></span>
      <h1>404</h1>
      <h2>This endpoint doesn't exist.</h2>
      <p>The page you asked for isn't here — but the rest of the portfolio is. Taking you home in <strong id="n">6</strong>s.</p>
<pre>{
  <span class="k">"error"</span>: <span class="s">"not_found"</span>,
  <span class="k">"hint"</span>: <span class="s">"try GET /portfolio/"</span>
}</pre>
      <a class="btn" id="home" href="/portfolio/">Take me home →</a>
    </main>
    <script>
      var p = location.pathname;
      document.getElementById("path").textContent = p;
      var home = p.indexOf("/portfolio") === 0 ? "/portfolio/" : "/";
      document.getElementById("home").href = home;
      var n = 6, el = document.getElementById("n");
      var t = setInterval(function () { n--; el.textContent = n; if (n <= 0) { clearInterval(t); location.href = home; } }, 1000);
    </script>
  </body>
</html>
